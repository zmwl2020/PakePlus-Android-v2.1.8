<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国漫游戏 - 加载检测</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body, html {
            height: 100%;
            overflow: hidden;
        }
        
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: brightness(1.2);
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }
        
        .container {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 500px;
            animation: fadeIn 1s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        h1 {
            color: white;
            font-size: 3.5rem;
            margin-bottom: 50px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 30px;
            align-items: center;
        }
        
        .btn {
            padding: 16px 35px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            width: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(37, 117, 252, 0.7);
        }
        
        .support-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .support-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }
        
        .agreement {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        
        .agreement a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .agreement a:hover {
            color: white;
            text-decoration: underline;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        /* 加载弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        .loading-content {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 50px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: modalAppear 0.4s ease-out;
            position: relative;
        }
        
        @keyframes modalAppear {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            70% {
                transform: scale(1.02);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .loading-icon {
            font-size: 4rem;
            color: #6a11cb;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px #2575fc);
        }
        
        .loading-icon i {
            animation: rotate 2s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .loading-content h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 2rem;
            letter-spacing: 2px;
        }
        
        .loading-status {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 30px;
            min-height: 2em;
            transition: color 0.3s ease;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            border-radius: 20px;
            transition: width 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            box-shadow: 0 0 15px #2575fc;
        }
        
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        
        .loading-dots span {
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: dots 1.4s infinite ease-in-out;
        }
        
        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
            background-color: #6a11cb;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
            background-color: #8c3ae2;
        }
        .loading-dots span:nth-child(3) {
            background-color: #2575fc;
        }
        
        @keyframes dots {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* 客服QQ弹窗 */
        .qq-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        .qq-content {
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: modalAppear 0.4s ease-out;
            position: relative;
        }
        
        .qq-icon {
            font-size: 3.5rem;
            color: #12b7f5;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px #12b7f5);
        }
        
        .qq-content h3 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        
        .qq-number {
            color: #12b7f5;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 20px;
            background: rgba(18, 183, 245, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(18, 183, 245, 0.3);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        
        .qq-tips {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 25px;
        }
        
        .qq-close-btn {
            padding: 12px 35px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(37, 117, 252, 0.4);
        }
        
        .qq-close-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.6);
        }

        /* 错误弹窗 */
        .error-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1001;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        .error-content {
            background: rgba(220, 53, 69, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: shake 0.5s ease;
            position: relative;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .error-content h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .error-content p {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 25px;
            font-size: 1.2rem;
        }
        
        .error-close-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .error-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .btn {
                padding: 14px 30px;
                font-size: 1.2rem;
                width: 220px;
            }
            
            .container {
                top: 62%;
            }
            
            .loading-content {
                padding: 30px 25px;
            }
            
            .loading-icon {
                font-size: 3rem;
            }
            
            .loading-content h2 {
                font-size: 1.8rem;
            }
            
            .loading-status {
                font-size: 1rem;
            }
            
            .qq-content {
                padding: 30px 20px;
            }
            
            .qq-icon {
                font-size: 3rem;
            }
            
            .qq-number {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- 背景视频 -->
    <div class="video-background">
        <video autoplay muted loop>
            <source src="home/AA/开始菜单.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        <div class="overlay"></div>
    </div>
    
    <!-- 主要内容 -->
    <div class="container">
        <h1>国漫游戏</h1>
        
        <div class="buttons">
            <button class="btn start-btn pulse" id="startBtn">
                <i class="fas fa-gamepad"></i>
                开始游戏
            </button>
            <button class="btn support-btn" id="supportBtn">
                <i class="fas fa-headset"></i>
                人工客服
            </button>
        </div>
    </div>
    
    <!-- 用户协议 -->
    <div class="agreement">
        <a href=" " id="agreementLink">用户协议</a >
    </div>
    
    <!-- 加载检测弹窗 -->
    <div class="modal" id="loadingModal">
        <div class="loading-content">
            <div class="loading-icon">
                <i class="fas fa-cog"></i>
            </div>
            <h2>检测状态</h2>
            <div class="loading-status" id="loadingStatus">正在验证购买信息...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
            </div>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
    
    <!-- 客服QQ弹窗 -->
    <div class="qq-modal" id="qqModal">
        <div class="qq-content">
            <div class="qq-icon">
                <i class="fab fa-qq"></i>
            </div>
            <h3>联系客服</h3>
            <div class="qq-tips">本软件唯一客服QQ：</div>
            <div class="qq-number">3173405776</div>
            <button class="qq-close-btn" id="closeQqModal">确定</button>
        </div>
    </div>
    
    <!-- 激活码错误提示弹窗 -->
    <div class="error-modal" id="errorModal">
        <div class="error-content">
            <h3>激活码错误</h3>
            <p>您输入的激活码不正确，请重新输入或联系客服获取正确的激活码。</p>
            <button class="error-close-btn" id="errorCloseBtn">确定</button>
        </div>
    </div>

    <script>
        // 获取元素
        const startBtn = document.getElementById('startBtn');
        const supportBtn = document.getElementById('supportBtn');
        const agreementLink = document.getElementById('agreementLink');
        const loadingModal = document.getElementById('loadingModal');
        const loadingStatus = document.getElementById('loadingStatus');
        const progressBar = document.getElementById('progressBar');
        const errorModal = document.getElementById('errorModal');
        const errorCloseBtn = document.getElementById('errorCloseBtn');
        
        // 客服QQ弹窗
        const qqModal = document.getElementById('qqModal');
        const closeQqModal = document.getElementById('closeQqModal');
        
        // 开始游戏按钮事件
        startBtn.addEventListener('click', function() {
            loadingModal.style.display = 'flex';
            
            progressBar.style.width = '0%';
            loadingStatus.textContent = '正在验证购买信息...';
            
            let step = 0;
            const totalSteps = 10;
            
            if (window.loadingInterval) {
                clearInterval(window.loadingInterval);
            }
            
            window.loadingInterval = setInterval(() => {
                step++;
                const percent = Math.min(step * 10, 100);
                progressBar.style.width = percent + '%';
                
                if (step === 1) {
                    loadingStatus.textContent = '正在验证购买信息...';
                } else if (step === 3) {
                    loadingStatus.textContent = '检测到游戏授权，正在校验...';
                } else if (step === 5) {
                    loadingStatus.textContent = '购买状态有效，加载资源中...';
                } else if (step === 7) {
                    loadingStatus.textContent = '即将进入游戏，请稍候...';
                } else if (step === 9) {
                    loadingStatus.textContent = '准备就绪，马上跳转！';
                }
                
                if (step >= totalSteps) {
                    clearInterval(window.loadingInterval);
                    
                    setTimeout(() => {
                        window.location.href = "home/nav.html";
                    }, 300);
                }
            }, 500);
        });
        
        // 人工客服 → 弹出QQ弹窗
        supportBtn.addEventListener('click', function() {
            qqModal.style.display = 'flex';
        });
        
        // 关闭QQ弹窗
        closeQqModal.addEventListener('click', function() {
            qqModal.style.display = 'none';
        });
        
        // 点击空白关闭
        window.addEventListener('click', function(event) {
            if (event.target === qqModal) {
                qqModal.style.display = 'none';
            }
            if (event.target === errorModal) {
                errorModal.style.display = 'none';
            }
        });
        
        // 关闭错误提示
        errorCloseBtn.addEventListener('click', function() {
            errorModal.style.display = 'none';
        });
        
        // 用户协议
        agreementLink.addEventListener('click', function(e) {
            e.preventDefault();
            alert('显示用户协议内容。在实际项目中，这里会打开协议弹窗或跳转到协议页面。');
        });
        
    </script>
</body>
</html>
